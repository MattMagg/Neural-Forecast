                print(f'⚠️  NeuralForecast validation failed: {str(e)[:100]}...')
            " 2>/dev/null || echo "NeuralForecast information not available"
            
            # Cross-Validation Performance Summary
            echo ""
            echo "Cross-Validation Performance Summary:"
            echo "===================================="
            echo "- NF-Native CV Execution: $(python -c 'from cv.runner import run_cv; print(\"✓ AVAILABLE\")' 2>/dev/null || echo '✗ FAILED')"
            echo "- sCRPS Computation: $(python -c 'from uq.metrics import compute_metrics_per_model; print(\"✓ AVAILABLE\")' 2>/dev/null || echo '✗ FAILED')"
            echo "- Coverage Diagnostics: $(python -c 'from uq.calibration import compute_coverage; print(\"✓ AVAILABLE\")' 2>/dev/null || echo '✗ FAILED')"
            echo "- Model Persistence: $(python -c 'from neuralforecast import NeuralForecast; print(\"✓ AVAILABLE\")' 2>/dev/null || echo '✗ FAILED')"
            echo "- GPU Memory Management: $(python -c 'from utils.risk_mitigation import GPUMemoryManager; print(\"✓ AVAILABLE\")' 2>/dev/null || echo '✗ FAILED')"
            
            echo ""
            echo "=== Cross-Validation Validation Report Complete ==="

# Workflow definitions
workflows:
  version: 2
  foundation_pipeline:
    when: << pipeline.parameters.run_foundation_tests >>
    jobs:
      - setup:
          filters:
            branches:
              only: /.*/
      - data_processing_validation:
          requires:
            - setup
          filters:
            branches:
              only: /.*/
      - feature_engineering_validation:
          requires:
            - data_processing_validation
          filters:
            branches:
              only: /.*/
      - model_factory_validation:
          requires:
            - feature_engineering_validation
          filters:
            branches:
              only: /.*/
          context: gpu-context  # Add GPU context if needed for resource access
      - cross_validation_testing:
          requires:
            - model_factory_validation
          filters:
            branches:
              only: /.*/
          context: gpu-context  # GPU context for cross-validation job