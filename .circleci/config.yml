            source .venv/bin/activate
            
            echo "=== NF-Native Cross-Validation Integration Test ==="
            
            # Check if processed data is available for integration testing
            if [ -f "data/processed/btc_canonical_"*".parquet" ]; then
              echo "✓ Processed data found - running integration test with real data"
              
              python -c "
              import pandas as pd
              import numpy as np
              import glob
              from pathlib import Path
              
              # Load processed data
              data_files = glob.glob('data/processed/btc_canonical_*.parquet')
              if data_files:
                  df = pd.read_parquet(data_files[0])
                  print(f'✓ Loaded processed data: {len(df)} rows')
                  
                  # Take a small sample for CV testing (last 2000 rows for speed)
                  test_df = df.tail(2000).copy()
                  print(f'✓ Using test sample: {len(test_df)} rows')
                  
                  # Validate data structure for CV
                  required_cols = ['unique_id', 'ds', 'y']
                  missing_cols = [col for col in required_cols if col not in test_df.columns]
                  if missing_cols:
                      raise ValueError(f'Missing required columns: {missing_cols}')
                  
                  print('✓ Data structure validated for cross-validation')
                  
                  # Test minimal CV configuration
                  from neuralforecast import NeuralForecast
                  from neuralforecast.models import NHITS
                  from neuralforecast.losses.pytorch import DistributionLoss
                  from cv.runner import run_cv
                  
                  # Create minimal model for integration test
                  model = NHITS(
                      h=4,
                      input_size=24,
                      loss=DistributionLoss(distribution='StudentT', return_params=True),
                      max_steps=5,  # Minimal training for CI
                      batch_size=64,  # Small batch for CI
                      enable_progress_bar=False
                  )
                  
                  nf = NeuralForecast(models=[model], freq='15min')
                  
                  # CV configuration for integration test
                  cv_config = {
                      'n_windows': 2,  # Minimal for CI
                      'step_size': 4,
                      'val_size': 16,
                      'h': 4,
                      'level': [80, 90, 95]
                  }
                  
                  print('✓ Starting NF-native cross-validation integration test...')
                  
                  # Execute cross-validation
                  cv_results = run_cv(
                      nf=nf,
                      df=test_df,
                      cfg=cv_config,
                      use_conformal=False,
                      enable_recovery=True
                  )
                  
                  print(f'✓ CV integration test completed: {len(cv_results)} predictions')
                  print(f'✓ CV windows: {cv_results[\"cutoff\"].nunique()}')
                  print(f'✓ Models: {[col for col in cv_results.columns if col not in [\"unique_id\", \"ds\", \"cutoff\", \"y\"]]}')
                  
                  # Test summarization
                  from cv.runner import summarize_cv
                  
                  summary = summarize_cv(
                      cv_df=cv_results,
                      models=['NHITS'],
                      h=4,
                      generate_plots=False  # Skip plots in CI
                  )
                  
                  print(f'✓ CV summarization completed: {list(summary.keys())} results')
                  
                  if 'metrics' in summary and not summary['metrics'].empty:
                      metrics = summary['metrics']
                      if 'sCRPS_mean' in metrics.columns:
                          scrps = metrics['sCRPS_mean'].iloc[0]
                          print(f'✓ sCRPS computed: {scrps:.6f}')
                      else:
                          print('⚠️  sCRPS not found in metrics')
                  else:
                      print('⚠️  No metrics computed')
                  
                  print('✓ NF-native cross-validation integration test passed')
              else:
                  print('⚠️  No processed data files found')
              "
            else
              echo "⚠️  No processed data available - skipping integration test"
              echo "This is expected if data processing job hasn't run yet"
