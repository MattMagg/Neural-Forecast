              find artifacts/feature_engineering -name "*.json" -exec ls -lh {} \; 2>/dev/null || echo "No JSON files found"
              find artifacts/feature_engineering -name "*.md" -exec ls -lh {} \; 2>/dev/null || echo "No report files found"
              echo "Total artifacts size: $(du -sh artifacts/feature_engineering/ 2>/dev/null | cut -f1 || echo 'N/A')"
            else
              echo "⚠️  No feature engineering artifacts directory found"
            fi
            
            echo ""
            echo "Validation Summary:"
            echo "- Feature Registry: $([ -f 'features/registry.py' ] && echo '✓ AVAILABLE' || echo '✗ MISSING')"
            echo "- Feature Builder: $([ -f 'features/builder.py' ] && echo '✓ AVAILABLE' || echo '✗ MISSING')"
            echo "- Indicator Computation: $([ -f 'artifacts/feature_engineering/feature_metadata_*.json' ] && echo '✓ PASSED' || echo '✗ FAILED')"
            echo "- MTF Alignment: $([ -f 'artifacts/feature_engineering/feature_validation_report_*.md' ] && echo '✓ PASSED' || echo '✗ FAILED')"
