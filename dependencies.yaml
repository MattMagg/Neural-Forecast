python_version: "3.13.6"

# =============================================================================
# THUNDER COMPUTE PRE-INSTALLED SOFTWARE
# =============================================================================
preinstalled:
  cuda: "12.9"                    # Pre-installed on Thunder Compute
  cudnn: "9.0"                    # Pre-installed on Thunder Compute  
  python: "latest"                # Pre-installed Python with pip
  pytorch_base: "2.7.1"          # Pre-installed (will upgrade to 2.8.0)
  jupyterlab: "latest"            # Pre-installed
  numpy: "latest"                 # Pre-installed (scientific Python libraries)
  pandas: "latest"                # Pre-installed (scientific Python libraries)

# =============================================================================
# CORE MACHINE LEARNING & FORECASTING
# =============================================================================
core_ml:
  neuralforecast: "3.0.2"        # Latest (Jun 17, 2025) - MAJOR BREAKING CHANGES
  torch: "2.8.0"                 # Upgrade from pre-installed 2.7.1 for CUDA 12.9 compatibility
  pytorch-lightning: "2.5.3"     # Latest stable

# =============================================================================
# DATA PROCESSING & MANIPULATION
# =============================================================================
data_processing:
  pandas: "2.3.1"                # Latest (Jul 7, 2025)
  numpy: "2.3.2"                 # Latest (Jul 24, 2025) - Major version
  pyarrow: "20.0.0"              # Latest (Apr 27, 2025)

# =============================================================================
# FEATURE ENGINEERING & TECHNICAL ANALYSIS
# =============================================================================
feature_engineering:
  vectorbt: "0.28.0"             # Latest stable
  TA-Lib: "0.6.5"                # Latest - Supports numpy 2
  pandas-ta: "0.3.14b"           # Original (old, consider alternatives)
  pandas-ta-openbb: "0.4.22"     # Alternative (Jul 5, 2025) - NumPy 2 compatible
  freqtrade: "2025.7"            # Latest (Aug 14, 2025)

# =============================================================================
# MACHINE LEARNING UTILITIES
# =============================================================================
ml_utilities:
  scikit-learn: "1.7.1"          # Latest (Jul 18, 2025)
  statsmodels: "0.14.5"          # Latest (Jul 7, 2025)

# =============================================================================
# VISUALIZATION & PLOTTING
# =============================================================================
visualization:
  matplotlib: "3.10.5"           # Latest (Jul 31, 2025)
  seaborn: "0.13.2"              # Latest stable
  plotly: "6.3.0"                # Latest

# =============================================================================
# JUPYTER NOTEBOOKS & EXECUTION
# =============================================================================
notebooks:
  jupyter: "1.1.1"               # Metapackage
  notebook: "7.4.5"              # Latest Jupyter Notebook
  papermill: "2.6.0"             # Latest
  nbconvert: "7.16.6"            # Latest
  ipykernel: "6.30.1"            # Latest (Aug 4, 2025)

# =============================================================================
# CLOUD INFRASTRUCTURE & DEPLOYMENT
# =============================================================================
infrastructure:
  modal: "1.1.3"                 # Latest (Aug 19, 2025)

# =============================================================================
# UTILITIES & HELPERS
# =============================================================================
utilities:
  pyyaml: "6.0.2"                # Latest (Aug 6, 2024)
  joblib: "1.5.1"                # Latest (May 23, 2025)
  tqdm: "4.67.1"                 # Latest (Nov 24, 2024)
  GPUtil: "1.4.0"                # Latest stable

# =============================================================================
# TESTING & QUALITY ASSURANCE
# =============================================================================
testing:
  pytest: "8.4.1"                # Latest (Jun 18, 2025)
  pytest-cov: "6.0.0"            # Latest (Jun 12, 2025)

# =============================================================================
# INSTALLATION ORDER (THUNDER COMPUTE OPTIMIZED)
# =============================================================================
installation_notes:
  thunder_compute_setup: |
    # Thunder Compute has CUDA 12.9, Python, PyTorch 2.7.1, JupyterLab, NumPy, Pandas pre-installed
    # Setup script will upgrade PyTorch to 2.8.0 for better CUDA 12.9 compatibility
    
  critical_order: |
    # MUST install in this order to avoid conflicts with pre-installed packages:
    1. python3 -m pip install --upgrade pip (upgrade pre-installed pip)
    2. pip install numpy (use compatible version with pre-installed base)
    3. pip install pandas pyarrow (use compatible versions)
    4. pip install --upgrade torch==2.8.0 (upgrade from pre-installed 2.7.1)
    5. pip install neuralforecast==3.0.2
    6. pip install scikit-learn==1.7.1
    7. Install TA-Lib C library FIRST, then pip install TA-Lib==0.6.5
    8. pip install remaining packages
  
  ta_lib_installation: |
    # TA-Lib requires C library first:
    # Thunder Compute: sudo apt-get install libta-lib-dev
    # Then: pip install TA-Lib==0.6.5
    
  cuda_compatibility: |
    # Thunder Compute CUDA 12.9 compatibility:
    # - PyTorch 2.8.0 supports CUDA 12.9
    # - No need to install CUDA drivers or toolkit
    # - CUDA paths should be pre-configured