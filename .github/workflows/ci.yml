name: Neural Forecast CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  basic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.local/lib/python${{ env.PYTHON_VERSION }}/site-packages
        key: ${{ runner.os }}-python-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-python-${{ env.PYTHON_VERSION }}-
          ${{ runner.os }}-python-
    
    - name: Cache APT packages
      uses: actions/cache@v4
      with:
        path: /var/cache/apt
        key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/ci.yml') }}
        restore-keys: |
          ${{ runner.os }}-apt-
    
    - name: Cache TA-Lib installation
      id: cache-talib
      uses: actions/cache@v4
      with:
        path: |
          /usr/local/lib/libta_lib*
          /usr/local/include/ta-lib/
          /usr/local/bin/ta-lib-config
        key: ${{ runner.os }}-talib-0.4.0-v2
        restore-keys: |
          ${{ runner.os }}-talib-0.4.0-
    
    - name: Cache status report
      run: |
        echo "=== Cache Status Report ==="
        echo "TA-Lib cache hit: ${{ steps.cache-talib.outputs.cache-hit }}"
        echo "Python cache paths:"
        echo "  - ~/.cache/pip"
        echo "  - ~/.local/lib/python${{ env.PYTHON_VERSION }}/site-packages"
        echo "=========================="
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget gfortran libopenblas-dev
    
    - name: Install TA-Lib (if not cached)
      if: steps.cache-talib.outputs.cache-hit != 'true'
      run: |
        echo "TA-Lib not found in cache, installing from source..."
        start_time=$(date +%s)
        wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
        tar -xzf ta-lib-0.4.0-src.tar.gz
        cd ta-lib/
        CFLAGS="-Wno-format-security" ./configure --prefix=/usr/local
        make
        sudo make install
        cd ..
        rm -rf ta-lib ta-lib-0.4.0-src.tar.gz
        end_time=$(date +%s)
        echo "TA-Lib installation completed in $((end_time - start_time)) seconds"
    
    - name: TA-Lib cache hit confirmation
      if: steps.cache-talib.outputs.cache-hit == 'true'
      run: |
        echo "✓ TA-Lib restored from cache - significant time saved!"
        ls -la /usr/local/lib/libta_lib* || echo "Checking TA-Lib files..."
        ls -la /usr/local/include/ta-lib/ || echo "Checking TA-Lib headers..."
    
    - name: Configure TA-Lib (always run)
      run: |
        sudo ldconfig
        echo "TA-Lib configuration completed"
    
    - name: Upgrade pip and install Python dependencies
      run: |
        echo "Installing Python dependencies..."
        start_time=$(date +%s)
        python -m pip install --upgrade pip setuptools wheel
        # Use minimal CI requirements for faster, more reliable builds
        pip install -r requirements-ci.txt
        end_time=$(date +%s)
        echo "Python dependencies installed in $((end_time - start_time)) seconds"
    
    - name: Basic import validation
      run: |
        echo "Testing core module imports..."
        python -c "
        import sys
        packages = [
            ('talib', 'TA-Lib'),
            ('pandas', 'Pandas'),
            ('numpy', 'NumPy'),
            ('sklearn', 'Scikit-learn'),
            ('pyarrow', 'PyArrow'),
            ('yaml', 'PyYAML')
        ]
        
        failed = []
        for pkg, name in packages:
            try:
                module = __import__(pkg)
                version = getattr(module, '__version__', 'unknown')
                print(f'✓ {name}: {version}')
            except ImportError as e:
                print(f'✗ {name}: Import failed - {e}')
                failed.append(name)
        
        if failed:
            print(f'\\nFailed imports: {failed}')
            sys.exit(1)
        else:
            print('\\n✓ All core packages imported successfully')
        "
    
    - name: Verify TA-Lib functionality
      run: |
        python -c "
        import talib
        import numpy as np
        
        # Test TA-Lib functionality
        test_data = np.random.random(100)
        sma = talib.SMA(test_data, timeperiod=10)
        assert not np.isnan(sma[-1]), 'TA-Lib SMA calculation failed'
        print('✓ TA-Lib functionality verified')
        "